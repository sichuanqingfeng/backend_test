name: build-and-push-image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: crpi-z7xsgj5pgtmfh9sv.cn-heyuan.personal.cr.aliyuncs.com
  IMAGE: viki_test/backend-test

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 从 tag 提取版本号
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "提取到版本号: $VERSION"

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false            # 关闭 provenance 附加清单
          sbom: false                  # 关闭 SBOM 附加清单
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          outputs: type=docker
